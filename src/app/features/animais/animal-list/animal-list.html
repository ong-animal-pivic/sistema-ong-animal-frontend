<div class="lista-cabecalho">
  <h1>Animais</h1>
  <button mat-raised-button color="primary" routerLink="/animais/novo">
    <mat-icon>add</mat-icon>
    Novo animal
  </button>
</div>

@if (carregando()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!carregando() && animais().length === 0) {
  <p class="vazio">Nenhum animal cadastrado.</p>
} @else {
  <table mat-table [dataSource]="animais()" class="tabela">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let a">{{ a.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="especie">
      <th mat-header-cell *matHeaderCellDef>Espécie</th>
      <td mat-cell *matCellDef="let a">{{ nomeEspecie(a) }}</td>
    </ng-container>

    <ng-container matColumnDef="raca">
      <th mat-header-cell *matHeaderCellDef>Raça</th>
      <td mat-cell *matCellDef="let a">{{ nomeRaca(a) }}</td>
    </ng-container>

    <ng-container matColumnDef="porte">
      <th mat-header-cell *matHeaderCellDef>Porte</th>
      <td mat-cell *matCellDef="let a">{{ rotuloPorte(a) }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let a">{{ rotuloStatus(a) }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef class="col-acoes">Ações</th>
      <td mat-cell *matCellDef="let a" class="col-acoes">
        <button
          mat-icon-button
          color="primary"
          matTooltip="Editar"
          [routerLink]="['/animais', a.id, 'editar']"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          color="warn"
          matTooltip="Excluir"
          (click)="confirmarExclusao(a)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>
}
